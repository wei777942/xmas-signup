<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聖誕手作課程・報名</title>
<meta name="description" content="12/24（四）14:30–15:30 聖誕手作課程報名：聖誕燭台、聖誕紅組盆、手作護唇膏3支，每組限 12 人。">
<meta property="og:title" content="🎄 聖誕手作課程・報名">
<meta property="og:description" content="12/24（四）14:30–15:30｜每組限 12 人，額滿為止">
<meta name="theme-color" content="#8e0e22">
<style>
:root{--red:#b3122e;--deep:#7a0b1d;--green:#14532d;--gold:#d4a72c;--cream:#fff8ec}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#2b1a12;
  background:radial-gradient(circle at 20% 0%,#a3132c 0,#6d0a19 55%,#3d0610 100%) fixed;min-height:100vh;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px 40px}
.cover{margin:0 -14px;position:relative}
.cover img{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.hero[hidden]{display:none}
.hero{padding:42px 20px 30px;text-align:center;color:#fff;position:relative}
.hero .tree{font-size:56px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.hero h1{margin:10px 0 6px;font-size:34px;letter-spacing:.08em;color:#ffe9a8;text-shadow:0 2px 0 #7a4b00,0 6px 18px rgba(0,0,0,.4)}
.hero .sub{font-size:15px;letter-spacing:.3em;color:#f6d77a}
.lights{height:18px;margin:0 -14px;background:
  radial-gradient(circle at 10px 9px,#ffd54a 4px,transparent 5px) 0 0/40px 18px,
  radial-gradient(circle at 30px 9px,#4ade80 4px,transparent 5px) 0 0/40px 18px;
  animation:blink 2.4s steps(2) infinite}
@keyframes blink{50%{filter:hue-rotate(140deg) brightness(1.2)}}
.card{background:var(--cream);border-radius:18px;padding:20px 18px;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);border:2px solid var(--gold);position:relative}
.card h2{margin:0 0 12px;font-size:19px;color:var(--deep);display:flex;align-items:center;gap:8px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
.info b{color:var(--green)}
.items{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid #e6d3a8;border-radius:14px;background:#fff;cursor:pointer;transition:.15s;position:relative}
.item input{position:absolute;opacity:0}
.item .emo{font-size:30px;width:44px;text-align:center}
.item .nm{font-size:17px;font-weight:700;color:#3b1a0e}
.item .left{font-size:14px;color:var(--green);margin-top:2px}
.item .bar{height:6px;border-radius:3px;background:#efe3c8;margin-top:6px;overflow:hidden}
.item .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#22a35a)}
.item .grow{flex:1}
.item .chk{width:24px;height:24px;border-radius:50%;border:2px solid #cdb680;flex:none}
.item:has(input:checked){border-color:var(--red);background:#fff1f1;box-shadow:0 0 0 3px rgba(179,18,46,.15)}
.item:has(input:checked) .chk{background:var(--red);border-color:var(--red);box-shadow:inset 0 0 0 4px #fff}
.item.full{opacity:.55;cursor:not-allowed;filter:grayscale(.6)}
.item.full .left{color:var(--red);font-weight:700}
.item.full .bar i{background:var(--red)}
.tag{position:absolute;top:-9px;right:10px;background:var(--red);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;display:none}
.item.full .tag{display:block}
label.f{display:block;margin:14px 0 6px;font-weight:700;color:var(--deep)}
input.t{width:100%;font-size:17px;padding:12px 14px;border:2px solid #e6d3a8;border-radius:12px;background:#fff;outline:none}
input.t:focus{border-color:var(--gold)}
.hint{font-size:13px;color:#8a6d50;margin-top:4px}
button.go{margin-top:18px;width:100%;font-size:18px;font-weight:700;letter-spacing:.2em;padding:15px;border:0;border-radius:14px;color:#fff;
  background:linear-gradient(180deg,#d31b3b,#9d0f27);box-shadow:0 4px 0 #6d0a19,0 8px 18px rgba(0,0,0,.25);cursor:pointer}
button.go:disabled{opacity:.6}
.msg{margin-top:12px;padding:12px;border-radius:10px;font-size:15px;display:none}
.msg.err{display:block;background:#ffe5e5;color:#9d0f27}
.done{text-align:center;padding:10px 0}
.done .big{font-size:52px}
.done h3{color:var(--green);font-size:22px;margin:8px 0}
.done p{margin:6px 0;font-size:16px}
.again{background:none;border:2px solid var(--green);color:var(--green);padding:10px 16px;border-radius:12px;font-size:15px;margin-top:12px;cursor:pointer}
footer{text-align:center;color:#f3d38a;font-size:13px;margin-top:22px;opacity:.85}
.holly{position:absolute;top:-14px;left:-10px;font-size:26px;transform:rotate(-20deg)}
.mine h3{color:var(--green);font-size:22px;margin:4px 0 10px;text-align:center}
.now{font-size:17px;text-align:center;margin:6px 0}
.now b{color:var(--deep);font-size:20px}
.codebox{margin:12px auto;text-align:center;background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;max-width:300px}
.codebox .c{font-size:36px;font-weight:800;letter-spacing:.35em;color:var(--red);font-family:ui-monospace,Menlo,monospace;padding-left:.35em}
.codebox .hint{margin-top:2px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;font-size:16px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.b-green{background:var(--green);color:#fff;border:0}
.b-ghost{background:#fff;color:var(--red);border:2px solid var(--red)}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:#8a6d50;text-decoration:underline;font-size:14px;cursor:pointer}
.sub-h{font-weight:700;color:var(--deep);margin:16px 0 8px}
.ok{display:block;background:#e3f6e8;color:var(--green)}
.editlink{display:block;text-align:center;color:#ffe9a8;margin-top:14px;font-size:15px;text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="wrap">
  <div class="cover" id="cover">
    <img id="coverImg" src="/cover.jpg" width="1080" height="1350" alt="聖誕手作課程｜12/24（四）14:30–15:30｜每組限 12 人"
      onerror="this.remove();document.getElementById('hero').hidden=false">
    <div class="hero" id="hero" hidden>
      <div class="tree">🎄</div>
      <h1>聖誕手作課程</h1>
      <div class="sub">CHRISTMAS ・ HANDMADE</div>
    </div>
  </div>
  <div class="lights"></div>

  <!-- 我的報名（同一支手機記得；或用姓名＋修改碼叫出） -->
  <div class="card mine" id="mine" hidden>
    <span class="holly">🎀</span>
    <h3 id="mineTitle">🎅 報名成功！</h3>
    <p class="now">你已報名：<b id="mineItem"></b></p>
    <p class="now" id="mineName" style="font-size:15px;color:#6b4f36"></p>
    <div class="codebox"><div class="hint">你的修改碼</div><div class="c" id="mineCode"></div>
      <div class="hint">請截圖或記下來，換手機要改報名時會用到</div></div>
    <div class="row" id="mineBtns">
      <button class="b-green" id="btnChange" type="button">改報其他課程</button>
      <button class="b-ghost" id="btnCancel" type="button">取消報名</button>
    </div>
    <div id="changeBox" hidden>
      <div class="sub-h">改報哪一個課程？</div>
      <div class="items" id="otherItems"></div>
      <div class="row">
        <button class="b-green" id="btnDoChange" type="button">確定改報</button>
        <button class="b-ghost" id="btnNoChange" type="button">先不要</button>
      </div>
    </div>
    <div class="msg" id="mineMsg"></div>
    <p class="now" style="font-size:15px;margin-top:14px">12/24（四）14:30 見，聖誕快樂！</p>
    <button class="linkbtn" id="btnOther" type="button">幫其他同事報名</button>
  </div>

  <form class="card" id="form" autocomplete="on">
    <span class="holly">🎀</span>
    <h2>✨ 選擇手作項目</h2>
    <div class="hint" style="margin:-6px 0 12px">12/24（四）14:30–15:30・每組限 12 人・每人限報一項</div>
    <div class="items" id="items"><div class="hint">名額載入中…</div></div>

    <label class="f" for="name">姓名（請填真實姓名）</label>
    <input class="t" id="name" name="name" required minlength="2" maxlength="30" placeholder="例如：王小明" autocomplete="name">

    <button class="go" id="go" type="submit">🎁 送出報名</button>
    <div class="msg" id="msg"></div>
  </form>

  <button class="editlink" id="openEdit" type="button">已經報名了？修改或取消報名 ↓</button>
  <form class="card" id="edit" hidden>
    <h2>✏️ 修改報名</h2>
    <div class="hint" style="margin:-6px 0 4px">輸入報名時的姓名和 4 位數修改碼。忘記修改碼請找主辦人。</div>
    <label class="f" for="eName">姓名</label>
    <input class="t" id="eName" required maxlength="30" placeholder="報名時填的姓名" autocomplete="name">
    <label class="f" for="eCode">修改碼</label>
    <input class="t" id="eCode" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4 位數字" autocomplete="off">
    <button class="go" id="eGo" type="submit">查詢我的報名</button>
    <div class="msg" id="eMsg"></div>
  </form>

  <footer>Merry Christmas ✦ 名額即時更新</footer>
</div>
<script>
const $ = id => document.getElementById(id);
const KEY = 'xs_me';
let items = [], me = null;

function itemHTML(it, radio, sel){
  return `<label class="item ${it.full?'full':''}">
      <span class="tag">額滿</span>
      <input type="radio" name="${radio}" value="${it.id}" ${it.full?'disabled':''} ${sel===it.id&&!it.full?'checked':''}>
      <span class="emo">${it.emoji}</span>
      <span class="grow"><div class="nm">${it.name}</div>
        <div class="left">${it.full?'額滿，無法報名':'剩 '+it.left+' 位（共 '+(it.taken+it.left)+' 位）'}</div>
        <div class="bar"><i style="width:${Math.min(100,it.taken/(it.taken+it.left)*100)}%"></i></div></span>
      <span class="chk"></span>
    </label>`;
}
const checked = n => (document.querySelector(`input[name=${n}]:checked`)||{}).value;
function render(){
  const a = checked('item'), b = checked('to');
  $('items').innerHTML = items.map(it => itemHTML(it,'item',a)).join('');
  if(me) $('otherItems').innerHTML = items.filter(it => it.id !== me.itemId).map(it => itemHTML(it,'to',b)).join('');
}
async function load(){
  try{ const d = await (await fetch('/api/status',{cache:'no-store'})).json(); items = d.items; render(); }
  catch(e){ if(!items.length) $('items').innerHTML='<div class="hint">名額載入失敗，請重新整理頁面。</div>'; }
}
async function api(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(d.error||'系統忙碌，請稍後再試'); e.status = r.status; throw e; }
  return d;
}
function say(el, text, ok){ el.textContent = text; el.className = 'msg ' + (ok?'ok':'err'); }
function clearMsg(el){ el.className = 'msg'; }

function showMine(d, title){
  me = d; localStorage.setItem(KEY, JSON.stringify({name:d.name, code:d.code}));
  $('mineTitle').textContent = title || '🎄 我的報名';
  $('mineItem').textContent = d.item;
  $('mineName').textContent = d.name;
  $('mineCode').textContent = d.code;
  $('changeBox').hidden = true; $('mineBtns').hidden = false; clearMsg($('mineMsg'));
  $('mine').hidden = false; $('form').hidden = true; $('edit').hidden = true; $('openEdit').hidden = true;
  render();
}
function showForm(){
  $('mine').hidden = true; $('form').hidden = false; $('openEdit').hidden = false; me = null; render();
}

$('form').addEventListener('submit', async e => {
  e.preventDefault(); clearMsg($('msg'));
  const item = checked('item');
  if(!item) return say($('msg'),'請先選擇一個項目');
  $('go').disabled = true; $('go').textContent = '送出中…';
  try{
    const d = await api('/api/signup',{item, name:$('name').value});
    $('form').reset(); showMine(d,'🎅 報名成功！');
    window.scrollTo({top:$('mine').offsetTop-20,behavior:'smooth'});
  }catch(err){ say($('msg'), err.message); }
  finally{ $('go').disabled = false; $('go').textContent = '🎁 送出報名'; load(); }
});

$('btnChange').onclick = () => { $('changeBox').hidden = false; $('mineBtns').hidden = true; clearMsg($('mineMsg')); load(); };
$('btnNoChange').onclick = () => { $('changeBox').hidden = true; $('mineBtns').hidden = false; };
$('btnDoChange').onclick = async () => {
  const to = checked('to'); if(!to) return say($('mineMsg'),'請選擇要改報的課程');
  try{
    const d = await api('/api/change',{name:me.name, code:me.code, item:to});
    showMine(d,'✅ 已改報成功'); say($('mineMsg'),'已改為「'+d.item+'」',true);
  }catch(err){ say($('mineMsg'), err.message); if(err.status===404) forget(); }
  load();
};
$('btnCancel').onclick = async () => {
  if(!confirm('確定要取消「'+me.item+'」的報名嗎？名額會釋出給其他人。')) return;
  try{
    await api('/api/cancel',{name:me.name, code:me.code});
    localStorage.removeItem(KEY); showForm(); say($('msg'),'已取消報名。想再參加可以重新報名。',true);
  }catch(err){ say($('mineMsg'), err.message); if(err.status===404) forget(); }
  load();
};
function forget(){ localStorage.removeItem(KEY); setTimeout(showForm, 1800); }
$('btnOther').onclick = () => { localStorage.removeItem(KEY); showForm(); $('name').focus(); };

$('openEdit').onclick = () => { $('edit').hidden = false; $('openEdit').hidden = true; $('eName').focus(); };
$('edit').addEventListener('submit', async e => {
  e.preventDefault(); clearMsg($('eMsg'));
  try{
    const d = await api('/api/lookup',{name:$('eName').value, code:$('eCode').value});
    $('edit').reset(); showMine(d,'🎄 我的報名');
    window.scrollTo({top:$('mine').offsetTop-20,behavior:'smooth'});
  }catch(err){ say($('eMsg'), err.message); }
});

(async () => {
  await load();
  try{
    const saved = JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved && saved.name && saved.code){
      try{ showMine(await api('/api/lookup',saved),'🎄 我的報名'); }
      catch(err){ if(err.status===404) localStorage.removeItem(KEY); }
    }
  }catch(e){}
})();
setInterval(()=>{ if(!document.hidden) load(); }, 8000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });

// subtle snow
(() => {
  const c = $('snow'), x = c.getContext('2d'); let W,H,f=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;}; size(); addEventListener('resize',size);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<55;i++) f.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.8,s:Math.random()*.6+.3,d:Math.random()*Math.PI*2});
  (function tick(){ x.clearRect(0,0,W,H); x.fillStyle='rgba(255,255,255,.75)';
    for(const p of f){ p.y+=p.s; p.d+=.01; p.x+=Math.sin(p.d)*.4; if(p.y>H){p.y=-5;p.x=Math.random()*W;}
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
    requestAnimationFrame(tick); })();
})();
</script>
</body>
</html>
